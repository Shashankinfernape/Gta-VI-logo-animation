<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>St. Joseph English High School — Neon Glow Animation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #container {
      position: relative;
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 0 50px rgba(236, 28, 135, 0.2);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(15, 15, 25, 0.75);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 100;
      transition: opacity 0.3s;
    }
    #ui:hover {
      background: rgba(15, 15, 25, 0.95);
    }
    button {
      background: linear-gradient(135deg, #ec1c87, #8a1f9e);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(236, 28, 135, 0.6);
    }
    .info {
      display: flex;
      align-items: center;
      font-family: monospace;
      font-size: 0.9rem;
      color: #ff9ed5;
      padding: 0 8px;
    }
  </style>
</head>
<body>

  <div id="container">
    <canvas id="viewCanvas" width="1920" height="1080"></canvas>
    
    <div id="ui">
      <button id="btnPlay">Play</button>
      <button id="btnRestart">Restart</button>
      <div class="info" id="timeInfo">0.00s / 9.10s</div>
    </div>
  </div>

  <audio id="bgAudio" src="audio.mp3" preload="auto"></audio>

  <script src="gta6_engine.js"></script>
  <script>
    const engine = new Gta6AnimationEngine('viewCanvas', 'bgAudio', null);
    engine.setTarget('st_joseph');

    const btnPlay = document.getElementById('btnPlay');
    const btnRestart = document.getElementById('btnRestart');
    const timeInfo = document.getElementById('timeInfo');

    btnPlay.addEventListener('click', () => {
      engine.togglePlay();
    });

    btnRestart.addEventListener('click', () => {
      engine.seek(0);
      engine.play();
    });

    engine.onTimeUpdate = (t, dur) => {
      timeInfo.textContent = t.toFixed(2) + 's / ' + dur.toFixed(2) + 's';
    };

    engine.onStateChange = (state) => {
      btnPlay.textContent = state === 'playing' ? 'Pause' : 'Play';
    };

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        engine.togglePlay();
      }
    });

    // Auto-start on user first click anywhere
    window.addEventListener('click', () => {
      if (!engine.isPlaying && engine.currentTime === 0) {
        engine.play();
      }
    }, { once: true });
  </script>
</body>
</html>
